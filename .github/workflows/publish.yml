name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A6823E: ${{ secrets.A6823E }}
          B00B86: ${{ secrets.B00B86 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A6823E', '')
          env_b = os.environ.get('B00B86', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 86d9fec53dd101a2f8f42c12e912e631d45aa295 -->', env_a)
          if env_b:
              result = result.replace('<!-- 76915d919f457ec139d22b2787b15045 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
